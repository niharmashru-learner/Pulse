<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE | Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><div class="login-shell"><div class="login-brand"><div class="pulse-mark">P</div><div><div class="brand">PULSE</div><small>YOUR DIGITAL WORKPLACE</small></div></div><div class="login-card"><div class="eyebrow">WELCOME BACK</div><h1>Good work starts<br>with a pulse.</h1><p class="muted">Sign in to step into your office.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label>Employee ID or Email</label><input name="username" placeholder="Enter your ID" required autofocus><label>Password</label><input name="password" type="password" placeholder="Your password" required><button class="btn primary full">Enter Office <span>↗</span></button></form><div class="login-foot">PULSE · Every task. Every person. Every day.</div></div></div></body></html>
