services:
  - type: web
    name: pulse-office
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: ADMIN_ID
        value: PULSE-ADMIN
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pulse.local
      - key: ADMIN_NAME
        value: Pulse Admin
  - type: pserv
    name: pulse-db
    plan: starter
    databaseName: pulse
    user: pulse
